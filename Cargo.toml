[workspace]
members = ["crates/lcoder-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
libc = "0.2"
notify = "8.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
